[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiku"
version = "0.1.0"
description = "Kiku (聞く, kiku - 'to hear'): a local audiobook creator powered by tiny-voca"
readme = "README.md"
requires-python = ">=3.11,<3.15"  # onnxruntime has no CPython 3.15 wheels yet
license = { text = "Apache-2.0" }
authors = [{ name = "Your Name" }]
dependencies = [
  "numpy>=1.24,<3",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
# Installs the tiny-voca engine and its "own" phonemizer front end.
# The weights and DIZIONE_DATA still need to be set up (see README / scripts/setup.sh).
engine = [
  # Legacy torch backend (optional). Declared directly so uv's CPU-only index
  # mapping in [tool.uv.sources] applies to it.
  "torch>=2.4,<3",
  "tiny-voca[own] @ git+https://github.com/n4ze3m/tiny-voca.git",
]
# Default lightweight backend: ONNX Runtime + the dizione phonemizer, no torch.
onnx = [
  "onnxruntime>=1.20,<2",
  "dizione @ git+https://github.com/n4ze3m/dizione.git",
]
# Local HTTP API (binds to 127.0.0.1 by default).
web = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "python-multipart>=0.0.9",  # file uploads
]
dev = [
  "pytest>=7,<9",
  "huggingface-hub>=0.34,<3",  # used by scripts/setup.sh to fetch the weights
  "httpx>=0.27,<1",            # FastAPI's TestClient
]

[project.scripts]
kiku = "audiobook_creator.cli:main"
kiku-api = "webapi.app:main"
# Legacy aliases.
audiobook-creator = "audiobook_creator.cli:main"
audiobook-api = "webapi.app:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["audiobook_creator*", "webapi*"]

[tool.setuptools.package-data]
audiobook_creator = ["py.typed"]
webapi = ["static/*"]

# uv: use the CPU-only PyTorch build. The default PyPI wheel on Linux pulls
# about 3 GB of CUDA libraries that this CPU-only project never uses.
# Remove the two sections below if you deliberately want a CUDA build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
